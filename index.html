<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Anime Matrix</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            netflix: { red: '#E50914', dark: '#141414', gray: '#808080', lightGray: '#e5e5e5', modal: '#181818' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #141414; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #141414; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #E50914; }

    .star-btn { transition: transform 0.15s ease, color 0.15s ease; text-shadow: 0 0 3px rgba(0,0,0,0.8); }
    .star-btn:hover, .star-btn:active { transform: scale(1.25); }
    .star-active { color: #E50914; }
    .star-inactive { color: #333333; }

    .poster-card { transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .poster-card:hover { transform: scale(1.05); z-index: 10; box-shadow: 0 8px 16px rgba(0,0,0,0.6); }
  </style>
</head>
<body class="text-netflix-lightGray min-h-screen font-sans flex flex-col justify-between selection:bg-netflix-red selection:text-white">

  <!-- ================= TOP NAVBAR ================= -->
  <nav class="sticky top-0 z-40 bg-gradient-to-b from-black/90 to-netflix-dark/40 backdrop-blur-sm px-6 md:px-[100px] py-3 flex justify-between items-center">
    <h1 class="text-xl md:text-2xl font-black text-netflix-red tracking-tighter uppercase cursor-pointer">
      Anime Matrix
    </h1>
    
    <div class="flex items-center gap-3">
      <button onclick="openUserRecommendationModal()" class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded text-white hover:text-netflix-lightGray transition bg-white/10 hover:bg-white/20">
        💡 <span class="hidden md:inline">แนะนำสำหรับฉัน</span>
      </button>
      <button onclick="promptAdminLogin()" class="flex items-center gap-1.5 px-2.5 py-1.5 text-xs font-semibold rounded text-white hover:text-netflix-lightGray transition bg-netflix-red/90 hover:bg-netflix-red">
        🔑 <span class="hidden md:inline">แอดมิน</span>
      </button>
    </div>
  </nav>

  <!-- ================= USER VIEW: POSTER GRID ================= -->
  <section id="userCatalogSection" class="flex-grow w-full max-w-[1600px] mx-auto px-6 md:px-[100px] py-6">
    <div class="flex flex-col md:flex-row justify-between items-end mb-4 gap-3">
      <div>
        <h2 class="text-lg md:text-xl font-bold text-white mb-0.5">อนิเมะยอดฮิต</h2>
        <p class="text-xs text-netflix-gray">แตะที่โปสเตอร์เพื่อโหวตคะแนน</p>
      </div>
      <div class="relative w-full md:w-56 group">
        <input type="text" id="searchInput" oninput="filterAnimeGrid()" placeholder="🔍 ค้นหาชื่อเรื่อง..." 
          class="w-full bg-black/50 border border-white/20 rounded px-3 py-1.5 text-xs text-white placeholder-netflix-gray focus:outline-none focus:border-white transition" />
      </div>
    </div>

    <div id="animeGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-cols-7 gap-3 md:gap-4">
      <div class="col-span-full py-16 text-center text-netflix-gray text-xs">⏳ กำลังโหลด...</div>
    </div>
  </section>

  <!-- ================= RATING MODAL ================= -->
  <div id="ratingModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-netflix-modal w-full max-w-lg rounded-lg shadow-2xl relative animate-in zoom-in-95 duration-200 overflow-hidden">
      
      <button onclick="closeRatingModal()" class="absolute top-3 right-3 z-10 bg-black/60 rounded-full w-7 h-7 flex items-center justify-center text-white hover:bg-white hover:text-black transition text-xs">
        ✕
      </button>

      <div class="relative w-full h-48 bg-black">
        <img id="modalPosterImg" src="" alt="Cover" class="w-full h-full object-cover opacity-70">
        <div class="absolute inset-0 bg-gradient-to-t from-netflix-modal via-netflix-modal/40 to-transparent"></div>
        <div class="absolute bottom-3 left-5 right-5">
          <h3 id="modalAnimeTitle" class="text-xl md:text-2xl font-black text-white leading-tight mb-1">Anime Name</h3>
          <div class="flex items-center gap-2 text-[11px] font-semibold">
            <span class="text-green-500">แนะนำ 98%</span>
            <span id="modalAnimeYear" class="text-white">2024</span>
          </div>
          <p id="modalAnimeGenre" class="text-netflix-gray text-[11px] mt-0.5">Genre</p>
        </div>
      </div>

      <div class="p-5">
        <form onsubmit="submitModalRating(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-white mb-1.5">ชื่อบัญชีของคุณ:</label>
            <input type="text" id="modalUsername" required placeholder="เช่น Saber" 
              class="w-full text-xs px-3 py-2 bg-[#333333] rounded focus:outline-none focus:ring-1 focus:ring-white text-white placeholder-netflix-gray" />
          </div>

          <div>
            <div class="flex justify-between items-end mb-1">
              <label class="block text-xs font-bold text-white">ความชอบของคุณ:</label>
              <span id="modalStarLabel" class="text-xs font-bold text-netflix-red">5 ดาว</span>
            </div>
            <div class="bg-[#2b2b2b] p-3 rounded flex justify-center gap-3">
              <button type="button" onclick="setModalRating(1)" class="star-btn text-2xl star-active">★</button>
              <button type="button" onclick="setModalRating(2)" class="star-btn text-2xl star-active">★</button>
              <button type="button" onclick="setModalRating(3)" class="star-btn text-2xl star-active">★</button>
              <button type="button" onclick="setModalRating(4)" class="star-btn text-2xl star-active">★</button>
              <button type="button" onclick="setModalRating(5)" class="star-btn text-2xl star-active">★</button>
            </div>
          </div>

          <button type="submit" id="modalSubmitBtn" class="w-full py-2.5 bg-white text-black font-bold text-sm rounded hover:bg-netflix-lightGray transition">
            บันทึกคะแนน
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= ADMIN DASHBOARD ================= -->
  <section id="adminDashboardSection" class="hidden flex-grow flex-col md:flex-row w-full max-w-[1600px] mx-auto px-6 md:px-[100px] py-6 gap-4">
    <aside class="w-full md:w-56 shrink-0 space-y-4">
      <h3 class="text-xl font-black text-white">Admin Panel</h3>
      <nav class="space-y-1 text-xs">
        <button onclick="switchAdminTab('overview')" id="tabBtn-overview" class="w-full text-left px-3 py-2.5 rounded bg-netflix-red text-white font-bold">ภาพรวมสถิติ</button>
        <button onclick="switchAdminTab('users')" id="tabBtn-users" class="w-full text-left px-3 py-2.5 rounded text-netflix-lightGray hover:bg-[#333] font-semibold">วิเคราะห์ผู้ใช้</button>
        <button onclick="switchAdminTab('ratings')" id="tabBtn-ratings" class="w-full text-left px-3 py-2.5 rounded text-netflix-lightGray hover:bg-[#333] font-semibold">ตารางคะแนน</button>
      </nav>
      <button onclick="exitAdminMode()" class="w-full py-2 rounded border border-netflix-gray text-netflix-gray hover:text-white hover:border-white font-bold text-xs transition">ออกจากโหมดแอดมิน</button>
    </aside>

    <div class="flex-grow bg-[#181818] rounded-lg p-5 shadow-xl border border-[#333]">
      <div id="tabContent-overview" class="space-y-4">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
          <div class="bg-[#2b2b2b] p-3 rounded text-center">
            <span class="text-[10px] text-netflix-gray uppercase font-bold">ผู้ใช้ทั้งหมด</span>
            <span id="dashTotalUsers" class="block text-xl font-black text-white mt-0.5">0</span>
          </div>
          <div class="bg-[#2b2b2b] p-3 rounded text-center">
            <span class="text-[10px] text-netflix-gray uppercase font-bold">คะแนนรวม</span>
            <span id="dashTotalRatings" class="block text-xl font-black text-netflix-red mt-0.5">0</span>
          </div>
          <div class="bg-[#2b2b2b] p-3 rounded text-center">
            <span class="text-[10px] text-netflix-gray uppercase font-bold">ตอบวันนี้</span>
            <span id="dashTodayRatings" class="block text-xl font-black text-white mt-0.5">0</span>
          </div>
          <div class="bg-[#2b2b2b] p-3 rounded text-center">
            <span class="text-[10px] text-netflix-gray uppercase font-bold">เรตติ้งเฉลี่ย</span>
            <span id="dashGlobalAvg" class="block text-xl font-black text-yellow-500 mt-0.5">0.0</span>
          </div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-[#2b2b2b] p-4 rounded"><h4 class="text-xs font-bold text-white mb-2">กระจายตัวคะแนน</h4><div class="h-48"><canvas id="chartRatingDist"></canvas></div></div>
          <div class="bg-[#2b2b2b] p-4 rounded"><h4 class="text-xs font-bold text-white mb-2">5 อันดับฮิต</h4><div class="h-48"><canvas id="chartTopAnime"></canvas></div></div>
        </div>
      </div>

      <div id="tabContent-users" class="hidden space-y-4">
        <div>
          <label class="text-xs text-white font-bold block mb-2">เลือกโปรไฟล์ผู้ใช้:</label>
          <div id="adminUserBadges" class="flex flex-wrap gap-1.5 max-h-32 overflow-y-auto p-2 bg-[#2b2b2b] rounded"></div>
        </div>
        <div id="adminUserMatrixBox" class="bg-[#2b2b2b] p-4 rounded text-xs text-netflix-gray text-center">คลิกเลือกโปรไฟล์ด้านบน</div>
      </div>

      <div id="tabContent-ratings" class="hidden space-y-3">
        <h4 class="text-xs font-bold text-white">ตารางข้อมูลดิบ</h4>
        <div class="overflow-x-auto rounded bg-[#2b2b2b] max-h-[400px]">
          <table class="w-full text-left text-xs text-netflix-lightGray">
            <thead class="bg-[#141414] text-white uppercase text-[10px] sticky top-0">
              <tr><th class="p-3">User</th><th class="p-3">เรื่อง</th><th class="p-3">ปี</th><th class="p-3 text-right">คะแนน</th></tr>
            </thead>
            <tbody id="adminRatingsTableBody" class="divide-y divide-[#333]"></tbody>
          </table>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= LOGIC & JAVASCRIPT ================= -->
  <script>
    const SUPABASE_URL = "https://kvluqwmeblzowpmktvlu.supabase.co";
    const SUPABASE_KEY = "sb_publishable_InS9bbhcT_RWYHN0ip8SGg_aKGDqBR0";
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const ADMIN_PASSWORD = "1234";

    let animeMasterList = [];
    let selectedAnime = null;
    let modalRatingVal = 5;
    let distChart = null, topChart = null;
    const posterPool = ["https://images.unsplash.com/photo-1578632767115-351597cf2477?w=500&auto=format&fit=crop&q=80"];

    fetchAnimeCatalog();

    async function fetchAnimeCatalog() {
      const grid = document.getElementById("animeGrid");
      try {
        const { data, error } = await db.from('animes').select('id, title, genre, release_year, image_url').order('title', { ascending: true });
        if (error) throw error;
        animeMasterList = data || [];
        if (!animeMasterList.length) { grid.innerHTML = `<div class="col-span-full py-12 text-center text-netflix-gray">ไม่มีเนื้อหาในระบบ</div>`; return; }
        renderGrid(animeMasterList);
      } catch (err) { grid.innerHTML = `<div class="col-span-full py-12 text-center text-netflix-red">โหลดข้อมูลล้มเหลว</div>`; }
    }

    function renderGrid(list) {
      document.getElementById("animeGrid").innerHTML = list.map((anime, index) => {
        const posterUrl = anime.image_url || posterPool[0];
        return `
          <div onclick="openRatingModal('${escapeHtml(anime.title)}')" class="poster-card relative cursor-pointer rounded overflow-hidden bg-[#2b2b2b] group">
            <div class="relative w-full aspect-[2/3]">
              <img src="${posterUrl}" alt="${anime.title}" loading="lazy" class="w-full h-full object-cover">
              <div class="absolute inset-0 bg-gradient-to-t from-black via-black/40 to-transparent opacity-0 group-hover:opacity-100 transition duration-300 flex flex-col justify-end p-2.5">
                <h4 class="text-white font-bold text-[10px] leading-tight drop-shadow-md line-clamp-2">${anime.title}</h4>
                <span class="text-white text-[9px] mt-0.5">${anime.release_year}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filterAnimeGrid() {
      const q = document.getElementById("searchInput").value.toLowerCase().trim();
      renderGrid(animeMasterList.filter(a => a.title.toLowerCase().includes(q) || a.genre.toLowerCase().includes(q)));
    }

    function openRatingModal(title) {
      selectedAnime = animeMasterList.find(a => a.title === title);
      if (!selectedAnime) return;
      document.getElementById("modalAnimeTitle").innerText = selectedAnime.title;
      document.getElementById("modalAnimeYear").innerText = selectedAnime.release_year;
      document.getElementById("modalAnimeGenre").innerText = selectedAnime.genre;
      document.getElementById("modalPosterImg").src = selectedAnime.image_url || posterPool[0];
      setModalRating(5);
      document.getElementById("ratingModal").classList.remove("hidden");
    }

    function closeRatingModal() { document.getElementById("ratingModal").classList.add("hidden"); }

    function setModalRating(val) {
      modalRatingVal = val;
      document.getElementById("modalStarLabel").innerText = `${val} ดาว`;
      document.querySelectorAll("#ratingModal .star-btn").forEach((btn, idx) => {
        btn.className = `star-btn text-2xl ${idx < val ? 'star-active' : 'star-inactive'}`;
      });
    }

    async function submitModalRating(e) {
      e.preventDefault();
      const user = document.getElementById("modalUsername").value.trim();
      if (!selectedAnime || !user) return;
      const btn = document.getElementById("modalSubmitBtn");
      btn.disabled = true; btn.innerHTML = "กำลังบันทึก...";
      try {
        const { error } = await db.from('anime_ratings').insert([{ username: user, anime_name: selectedAnime.title, genre: selectedAnime.genre, release_year: selectedAnime.release_year, rating: modalRatingVal }]);
        if (error) throw error;
        closeRatingModal();
        Swal.fire({ icon: 'success', title: 'สำเร็จ', text: `โหวตเรื่อง ${selectedAnime.title} แล้ว`, background: '#181818', color: '#fff', confirmButtonColor: '#E50914' });
      } catch (err) { Swal.fire({ icon: 'error', text: err.message, background: '#181818', color: '#fff' }); } 
      finally { btn.disabled = false; btn.innerHTML = "บันทึกคะแนน"; }
    }

    // ================= ADMIN FUNCTIONS =================
    async function promptAdminLogin() {
      const { value: pass } = await Swal.fire({ title: 'แอดมิน', input: 'password', showCancelButton: true, confirmButtonColor: '#E50914', background: '#181818', color: '#fff' });
      if (pass === ADMIN_PASSWORD) {
        document.getElementById("userCatalogSection").classList.add("hidden");
        document.getElementById("adminDashboardSection").classList.remove("hidden");
        document.getElementById("adminDashboardSection").classList.add("flex");
        loadAdminDashboardData();
      } else if (pass) Swal.fire({ icon: 'error', title: 'รหัสผิด', background: '#181818', color: '#fff', confirmButtonColor: '#E50914' });
    }

    function exitAdminMode() {
      document.getElementById("adminDashboardSection").classList.add("hidden");
      document.getElementById("adminDashboardSection").classList.remove("flex");
      document.getElementById("userCatalogSection").classList.remove("hidden");
    }

    function switchAdminTab(t) {
      ['overview', 'users', 'ratings'].forEach(x => {
        document.getElementById(`tabContent-${x}`).classList.add("hidden");
        document.getElementById(`tabBtn-${x}`).className = "w-full text-left px-3 py-2.5 rounded text-netflix-lightGray hover:bg-[#333] font-semibold";
      });
      document.getElementById(`tabContent-${t}`).classList.remove("hidden");
      document.getElementById(`tabBtn-${t}`).className = "w-full text-left px-3 py-2.5 rounded bg-netflix-red text-white font-bold";
    }

    async function loadAdminDashboardData() {
      const { data: ratings, error } = await db.from('anime_ratings').select('*').order('created_at', { ascending: false });
      if (error || !ratings) return;

      const users = [...new Set(ratings.map(r => r.username))];
      const todayCount = ratings.filter(r => new Date(r.created_at) >= new Date().setHours(0,0,0,0)).length;
      document.getElementById("dashTotalUsers").innerText = users.length;
      document.getElementById("dashTotalRatings").innerText = ratings.length;
      document.getElementById("dashTodayRatings").innerText = todayCount;
      document.getElementById("dashGlobalAvg").innerText = ratings.length ? (ratings.reduce((a, r) => a + parseFloat(r.rating), 0) / ratings.length).toFixed(1) : "0.0";

      const dist = [0,0,0,0,0]; ratings.forEach(r => dist[Math.min(Math.round(r.rating),5)-1]++);
      if(distChart) distChart.destroy();
      distChart = new Chart(document.getElementById('chartRatingDist'), { type: 'bar', data: { labels: ['1','2','3','4','5'], datasets: [{ data: dist, backgroundColor: '#E50914' }] }, options: { plugins: { legend: { display: false } }, scales: { y: { ticks: { color: '#808080' }, grid: { color: '#333' } }, x: { grid: { display: false }, ticks: { color: '#808080' } } } }});

      const count = {}; ratings.forEach(r => count[r.anime_name] = (count[r.anime_name]||0)+1);
      const top = Object.entries(count).sort((a,b)=>b[1]-a[1]).slice(0,5);
      if(topChart) topChart.destroy();
      topChart = new Chart(document.getElementById('chartTopAnime'), { type: 'doughnut', data: { labels: top.map(t=>t[0].substring(0,10)+'..'), datasets: [{ data: top.map(t=>t[1]), backgroundColor: ['#E50914','#b20710','#fff','#808080','#333'], borderWidth: 0 }] }, options: { plugins: { legend: { position: 'right', labels: { color: '#fff', font: {size: 10} } } } }});

      document.getElementById("adminUserBadges").innerHTML = users.map(u => `<button onclick="inspectUser('${escapeHtml(u)}')" class="px-2 py-1 bg-[#333] hover:bg-white hover:text-black rounded text-[10px] font-bold text-white">${u}</button>`).join('');
      document.getElementById("adminRatingsTableBody").innerHTML = ratings.map(r => `<tr class="hover:bg-[#333]"><td class="p-3 font-bold text-white">${escapeHtml(r.username)}</td><td class="p-3">${escapeHtml(r.anime_name)}</td><td class="p-3">${r.release_year}</td><td class="p-3 text-right text-netflix-red font-bold">★ ${r.rating}</td></tr>`).join('');
    }

    const cRBar = (r, u) => { const s = r.filter(x=>x.username===u).map(x=>parseFloat(x.rating)); return s.length ? s.reduce((a,b)=>a+b,0)/s.length : 0; };
    const cSim = (r, u1, u2) => {
      const rb1 = cRBar(r,u1), rb2 = cRBar(r,u2), i1 = r.filter(x=>x.username===u1), i2 = r.filter(x=>x.username===u2);
      const com = i1.filter(a => i2.some(b => b.anime_name === a.anime_name));
      if(!com.length) return 0;
      let num = 0, d1 = 0, d2 = 0;
      com.forEach(item => { const r1 = parseFloat(item.rating), r2 = parseFloat(i2.find(x=>x.anime_name===item.anime_name).rating); num += (r1-rb1)*(r2-rb2); d1 += (r1-rb1)**2; d2 += (r2-rb2)**2; });
      return (d1*d2)===0 ? 0 : num/Math.sqrt(d1*d2);
    };

    async function inspectUser(u) {
      const { data: all } = await db.from('anime_ratings').select('*');
      const ur = all.filter(r=>r.username===u), rb = cRBar(all,u).toFixed(2), ou = [...new Set(all.map(r=>r.username))].filter(x=>x!==u);
      const sim = ou.map(x=>({user:x, sim: cSim(all,u,x)})).sort((a,b)=>b.sim-a.sim);
      const seen = ur.map(r=>r.anime_name), sugg = [...new Set(all.filter(r=>r.username!==u && !seen.includes(r.anime_name) && parseFloat(r.rating)>=4).map(r=>r.anime_name))];
      document.getElementById("adminUserMatrixBox").innerHTML = `
        <div class="text-left space-y-3">
          <div class="flex justify-between items-center border-b border-[#333] pb-2">
            <div><h4 class="font-bold text-white">${u}</h4><p class="text-[10px]">ดูแล้ว ${ur.length} เรื่อง</p></div>
            <span class="px-2 py-1 bg-netflix-red text-white font-bold rounded text-[10px]">r̄ = ${rb}</span>
          </div>
          <div class="grid grid-cols-2 gap-3 text-[10px]">
            <div><p class="font-bold text-white mb-1">ประวัติ</p><div class="h-24 overflow-y-auto pr-1 space-y-1">${ur.map(r=>`<div class="flex justify-between bg-[#141414] p-1.5 rounded"><span class="truncate w-3/4">${r.anime_name}</span><span class="text-netflix-red">★${r.rating}</span></div>`).join('')}</div></div>
            <div><p class="font-bold text-white mb-1">Sim(u,v)</p><div class="h-24 overflow-y-auto pr-1 space-y-1">${sim.map(s=>`<div class="flex justify-between bg-[#141414] p-1.5 rounded"><span>vs ${s.user}</span><span class="${s.sim>0.2?'text-green-500':''}">${s.sim.toFixed(2)}</span></div>`).join('')||'ไม่มีข้อมูล'}</div></div>
          </div>
          <div class="border-t border-[#333] pt-2"><p class="font-bold text-white mb-1 text-[10px]">เรื่องแนะนำ:</p><div class="bg-[#141414] p-2 rounded text-[10px]">${sugg.join(', ')||'-'}</div></div>
        </div>`;
    }

    async function openUserRecommendationModal() {
      const { value: u } = await Swal.fire({ title: 'ค้นหาเรื่องแนะนำ', input: 'text', confirmButtonColor: '#E50914', background: '#181818', color: '#fff' });
      if(!u) return;
      const { data: all } = await db.from('anime_ratings').select('*');
      const ur = all.filter(r=>r.username.toLowerCase()===u.trim().toLowerCase());
      if(!ur.length) return Swal.fire({ icon:'info', title:'ไม่พบประวัติ', background:'#181818', color:'#fff', confirmButtonColor:'#E50914'});
      const seen = ur.map(r=>r.anime_name), sugg = [...new Set(all.filter(r=>r.username.toLowerCase()!==u.trim().toLowerCase() && !seen.includes(r.anime_name) && parseFloat(r.rating)>=4).map(r=>r.anime_name))];
      Swal.fire({ title: 'เรื่องเด็ดของคุณ', html: `<div class="text-left text-xs"><p class="text-netflix-gray mb-2">อิงจาก ${ur.length} เรื่องที่ดู</p><div class="bg-[#2b2b2b] p-3 rounded text-white">${sugg.length?sugg.map(s=>`• ${s}`).join('<br>'):'โหวตเพิ่มหน่อย'}</div></div>`, background: '#181818', color: '#fff', confirmButtonColor: '#E50914' });
    }

    function escapeHtml(t) { return t ? t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;") : ''; }
  </script>
</body>
